<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BieberFlics</title>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(circle at 50% 30%, #6b21a8, #2e1065 70%);
    color: #fff; font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    overflow: hidden; display: flex; flex-direction: column; align-items: center;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  main { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 16px; width: 100%; max-width: 560px; height: 100%; justify-content: center; }
  h1 { margin: 0; font-size: clamp(2rem, 8vw, 3.4rem); letter-spacing: 1px; text-shadow: 0 3px 0 #7c3aed, 0 6px 18px rgba(0,0,0,.4); }
  h1 span { color: #e9d5ff; }
  #frame {
    width: min(78vw, 340px); aspect-ratio: 3/4; background: #fff; padding: 10px; border-radius: 18px;
    box-shadow: 0 12px 40px rgba(0,0,0,.5); display: none; transform-origin: center;
  }
  #frame img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; display: block; background: #ede9fe; }
  #frame.pop { animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.3) rotate(-8deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
  #beliebe {
    font: inherit; font-weight: 800; font-size: clamp(1.6rem, 7vw, 2.4rem); color: #4c1d95; background: #fff;
    border: 0; border-radius: 999px; padding: 18px 44px; cursor: pointer;
    box-shadow: 0 8px 0 #c4b5fd, 0 14px 30px rgba(0,0,0,.45); transition: transform .08s, box-shadow .08s;
  }
  #beliebe:hover { background: #faf5ff; }
  #beliebe:active { transform: translateY(6px); box-shadow: 0 2px 0 #c4b5fd, 0 6px 14px rgba(0,0,0,.45); }
  .small { font-size: .8rem; opacity: .85; text-align: center; }
  label.add { cursor: pointer; text-decoration: underline; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<canvas id="hearts"></canvas>
<main>
  <h1>Bieber<span>Flics</span></h1>
  <div id="frame"><img id="photo" alt="Justin Bieber"></div>
  <button id="beliebe">I beliebe</button>
  <div class="small">
    <label class="add">Choose your photo folder<input id="folder" type="file" webkitdirectory multiple></label>
    &nbsp;·&nbsp;
    <label class="add">Add photos<input id="files" type="file" accept="image/*" multiple></label>
  </div>
</main>

<script>
// ★ Put your Justin Bieber photo URLs or file names here (e.g. "pics/jb1.jpg").
// Photos you add with the "Add your own photos" link work too.
const PHOTOS = [
  // "pics/jb1.jpg",
  // "pics/jb2.jpg",
];

const uploaded = [];
const frame = document.getElementById('frame');
const photo = document.getElementById('photo');
let last = null;

function placeholder() {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><rect width="300" height="400" fill="url(#g)"/><text x="150" y="190" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#fff">Add your Bieber</text><text x="150" y="226" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#fff">photos below!</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

function showRandom() {
  const pool = PHOTOS.concat(uploaded);
  let src;
  if (!pool.length) { src = placeholder(); }
  else {
    do { src = pool[Math.floor(Math.random() * pool.length)]; } while (pool.length > 1 && src === last);
  }
  last = src;
  photo.src = src;
  frame.style.display = 'block';
  frame.classList.remove('pop'); void frame.offsetWidth; frame.classList.add('pop');
}

function addFiles(list) {
  let n = 0;
  for (const f of list) {
    if (f.type.startsWith('image/')) { uploaded.push(URL.createObjectURL(f)); n++; }
  }
  if (n) showRandom();
}
document.getElementById('files').addEventListener('change', e => addFiles(e.target.files));
document.getElementById('folder').addEventListener('change', e => addFiles(e.target.files));

// Hearts
const cv = document.getElementById('hearts');
const ctx = cv.getContext('2d');
let W, H, dpr;
function resize() {
  dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

const COLORS = ['#ffffff', '#ffffff', '#c084fc', '#a855f7', '#7e22ce', '#e9d5ff'];
const hearts = [];
function addHearts(n) {
  for (let i = 0; i < n; i++) {
    const size = 14 + Math.random() * 60;
    const speed = 1 + Math.random() * 3;
    const a = Math.random() * Math.PI * 2;
    hearts.push({
      x: size + Math.random() * (W - size * 2), y: size + Math.random() * (H - size * 2),
      vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, size,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      rot: (Math.random() - .5) * .6, vr: (Math.random() - .5) * .02, alpha: .75 + Math.random() * .25
    });
  }
  while (hearts.length > 140) hearts.shift();
}
function drawHeart(h) {
  const s = h.size;
  ctx.save();
  ctx.translate(h.x, h.y); ctx.rotate(h.rot);
  ctx.globalAlpha = h.alpha; ctx.fillStyle = h.color;
  ctx.beginPath();
  ctx.moveTo(0, s * .35);
  ctx.bezierCurveTo(-s * .6, -s * .1, -s * .45, -s * .6, 0, -s * .25);
  ctx.bezierCurveTo(s * .45, -s * .6, s * .6, -s * .1, 0, s * .35);
  ctx.fill();
  ctx.restore();
}
function tick() {
  ctx.clearRect(0, 0, W, H);
  for (const h of hearts) {
    h.x += h.vx; h.y += h.vy; h.rot += h.vr;
    const r = h.size * .55;
    if (h.x < r) { h.x = r; h.vx *= -1; } else if (h.x > W - r) { h.x = W - r; h.vx *= -1; }
    if (h.y < r) { h.y = r; h.vy *= -1; } else if (h.y > H - r) { h.y = H - r; h.vy *= -1; }
    drawHeart(h);
  }
  requestAnimationFrame(tick);
}
addHearts(14);
tick();

document.getElementById('beliebe').addEventListener('click', () => { showRandom(); addHearts(10); });
</script>
</body>
</html>
