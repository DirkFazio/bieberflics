
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BieberFlics</title>

<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  *, *::before, *::after { box-sizing: inherit; }

  html, body { min-height: 100%; margin: 0; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: radial-gradient(circle at 50% 30%, #6b21a8, #2e1065 70%);
    color: #fff;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  main {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px 16px;
    width: 100%;
    max-width: 560px;
    min-height: 100vh;
    min-height: 100dvh;
  }

  h1 {
    margin: 0;
    font-size: clamp(2rem, 8vw, 3.4rem);
    letter-spacing: 1px;
    text-align: center;
    text-shadow: 0 3px 0 #7c3aed, 0 6px 18px rgba(0,0,0,.4);
  }

  h1 span { color: #e9d5ff; }

  #frame {
    width: min(78vw, 340px);
    aspect-ratio: 3 / 4;
    background: #fff;
    padding: 10px;
    border-radius: 18px;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
    transform-origin: center;
  }

  #frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 10px;
    display: block;
    background: #ede9fe;
  }

  #frame.pop {
    animation: pop .45s cubic-bezier(.2,1.6,.4,1);
  }

  @keyframes pop {
    from { transform: scale(.3) rotate(-8deg); opacity: 0; }
    to { transform: scale(1) rotate(0); opacity: 1; }
  }

  #beliebe {
    font: inherit;
    font-weight: 800;
    font-size: clamp(1.6rem, 7vw, 2.4rem);
    color: #4c1d95;
    background: #fff;
    border: 0;
    border-radius: 999px;
    padding: 18px 44px;
    cursor: pointer;
    box-shadow: 0 8px 0 #c4b5fd, 0 14px 30px rgba(0,0,0,.45);
    transition: transform .08s, box-shadow .08s;
  }

  #beliebe:hover { background: #faf5ff; }

  #beliebe:active {
    transform: translateY(6px);
    box-shadow: 0 2px 0 #c4b5fd, 0 6px 14px rgba(0,0,0,.45);
  }

  #beliebe:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 5px;
  }

  .small {
    font-size: .85rem;
    opacity: .9;
    text-align: center;
    max-width: 90%;
  }

  #status { min-height: 1.2em; }

  @media (prefers-reduced-motion: reduce) {
    #frame.pop { animation: none; }
    #beliebe { transition: none; }
  }
</style>
</head>

<body>
<canvas id="hearts" aria-hidden="true"></canvas>

<main>
  <h1>Bieber<span>Flics</span></h1>

  <div id="frame">
    <img id="photo" alt="Justin Bieber photo">
  </div>

  <button id="beliebe" type="button">I beliebe</button>

  <div class="small" id="status" role="status" aria-live="polite">
    Loading your Bieber photos 💜
  </div>
</main>

<script>
"use strict";

// The list is loaded from this file in your GitHub repository.
const MANIFEST = "./photos.json";

const frame = document.getElementById("frame");
const photo = document.getElementById("photo");
const button = document.getElementById("beliebe");
const status = document.getElementById("status");

let photos = [];
let lastPhoto = null;
let loading = true;

function placeholder() {
  const svg = `
    <svg xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 300 400">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#c4b5fd"/>
          <stop offset="1" stop-color="#7c3aed"/>
        </linearGradient>
      </defs>
      <rect width="300" height="400" fill="url(#g)"/>
      <text x="150" y="185" text-anchor="middle"
        font-family="sans-serif" font-size="25"
        font-weight="bold" fill="white">BieberFlics</text>
      <text x="150" y="222" text-anchor="middle"
        font-family="sans-serif" font-size="18"
        fill="white">Photos coming soon!</text>
    </svg>`;

  return "data:image/svg+xml;charset=utf-8," +
    encodeURIComponent(svg);
}

function animateFrame() {
  frame.classList.remove("pop");
  void frame.offsetWidth;
  frame.classList.add("pop");
}

function showRandom() {
  if (!photos.length) {
    photo.onerror = null;
    photo.src = placeholder();
    status.textContent =
      "No photos available yet. Check photos.json.";
    return;
  }

  let index = Math.floor(Math.random() * photos.length);

  // Avoid repeating the previous photo when possible.
  if (photos.length > 1) {
    while (photos[index] === lastPhoto) {
      index = Math.floor(Math.random() * photos.length);
    }
  }

  const selected = photos[index];
  lastPhoto = selected;

  photo.onerror = () => {
    // Remove a broken image so it won't be chosen again.
    photos = photos.filter(src => src !== selected);
    lastPhoto = null;

    if (photos.length) {
      showRandom();
    } else {
      photo.onerror = null;
      photo.src = placeholder();
      status.textContent =
        "Couldn't load the photos. Check your filenames.";
    }
  };

  photo.src = selected;
  status.textContent = "";

  animateFrame();
}

async function loadPhotos() {
  try {
    const response = await fetch(MANIFEST, {
      cache: "no-cache"
    });

    if (!response.ok) {
      throw new Error("Could not load photos.json");
    }

    const files = await response.json();

    if (!Array.isArray(files)) {
      throw new Error("photos.json must contain a JSON array");
    }

    // Keep image paths relative to the published website.
    photos = [...new Set(
      files
        .filter(path =>
          typeof path === "string" &&
          /\.(jpe?g|png|webp|gif|avif)$/i.test(path)
        )
        .map(path => new URL(path, document.baseURI).href)
    )];

    loading = false;

    if (photos.length) {
      showRandom();
    } else {
      photo.src = placeholder();
      status.textContent =
        "Your photo list is empty. Add filenames to photos.json.";
    }
  } catch (error) {
    console.error("BieberFlics photo loading error:", error);
    loading = false;
    photo.src = placeholder();
    status.textContent =
      "Couldn't load photos. Check photos.json and your website files.";
  }
}

button.addEventListener("click", () => {
  if (loading) {
    status.textContent = "Your photos are still loading 💜";
    return;
  }

  showRandom();
  addHearts(10);
});

// Floating hearts
const cv = document.getElementById("hearts");
const ctx = cv.getContext("2d");

let W = 0, H = 0, dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resize);
resize();

const COLORS = [
  "#ffffff", "#ffffff", "#c084fc",
  "#a855f7", "#7e22ce", "#e9d5ff"
];

const hearts = [];

function addHearts(n) {
  for (let i = 0; i < n; i++) {
    const size = 14 + Math.random() * 45;
    const angle = Math.random() * Math.PI * 2;
    const speed = 0.5 + Math.random() * 1.5;

    hearts.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      rot: (Math.random() - 0.5) * 0.6,
      vr: (Math.random() - 0.5) * 0.02,
      alpha: 0.65 + Math.random() * 0.35
    });
  }

  while (hearts.length > 100) hearts.shift();
}

function drawHeart(h) {
  const s = h.size;

  ctx.save();
  ctx.translate(h.x, h.y);
  ctx.rotate(h.rot);
  ctx.globalAlpha = h.alpha;
  ctx.fillStyle = h.color;

  ctx.beginPath();
  ctx.moveTo(0, s * 0.35);
  ctx.bezierCurveTo(-s * 0.6, -s * 0.1, -s * 0.45, -s * 0.6, 0, -s * 0.25);
  ctx.bezierCurveTo(s * 0.45, -s * 0.6, s * 0.6, -s * 0.1, 0, s * 0.35);
  ctx.fill();
  ctx.restore();
}

function tick() {
  ctx.clearRect(0, 0, W, H);

  for (const h of hearts) {
    h.x += h.vx;
    h.y += h.vy;
    h.rot += h.vr;

    const r = h.size * 0.55;

    if (h.x < r || h.x > W - r) h.vx *= -1;
    if (h.y < r || h.y > H - r) h.vy *= -1;

    h.x = Math.max(r, Math.min(W - r, h.x));
    h.y = Math.max(r, Math.min(H - r, h.y));

    drawHeart(h);
  }

  requestAnimationFrame(tick);
}

addHearts(18);
tick();

// Load the collection automatically on page opening.
photo.src = placeholder();
loadPhotos();
</script>
</body>
</html>
